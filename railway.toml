# railway.toml
[build]
buildCommand = "npm run db:generate && npm run build --omit=dev"

[deploy]
# Run Prisma migrations before starting your app
preDeployCommand = "npm run db:migrate-deploy"

# Your app entry point
startCommand = "npm run start"

# Healthcheck settings (optional but good for Next.js)
# healthcheckPath = "/"
# healthcheckTimeout = 15
