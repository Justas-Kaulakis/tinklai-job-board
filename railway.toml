# # railway.toml
# [build]
# buildCommand = "npm run db:generate && npm run build"

# [deploy]
# # Run Prisma migrations before starting your app
# preDeployCommand = "npm run db:migrate-deploy && npm run db:seed"

# # Your app entry point
# startCommand = "npm run start"

# # Healthcheck settings (optional but good for Next.js)
# # healthcheckPath = "/"
# # healthcheckTimeout = 15


[build]
buildCommand = "npm install --omit=dev && npx prisma generate && npm run build"

[deploy]
preDeployCommand = "npx prisma migrate deploy && npx prisma db seed"
startCommand = "npm run start"
