version: '3.9'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    command: sh -c "
      npm run db:generate &&
      npm run db:migrate &&
      npm run db:seed &&
      npm run start
      "
    restart: unless-stopped
