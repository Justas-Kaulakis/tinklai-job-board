services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobboard
      POSTGRES_USER: justas
      POSTGRES_PASSWORD: justas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justas -d jobboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: runner
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://justas:justas@db:5432/jobboard
      NODE_ENV: production
      SEED: LT
      AUTO_DB_SEED: "true"
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
